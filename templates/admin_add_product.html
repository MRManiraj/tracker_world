<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3f6fb;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .box {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.1);
        }

        h1 {

            margin-top: 0;

            text-align: center;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;
        }

        textarea {

            resize: vertical;

            min-height: 90px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 22px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .back {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: #2563eb;

            text-decoration: none;
        }

        .flash {

            background: #dcfce7;

            color: #166534;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>

<body>


<div class="box">


    <h1>
        Add New Product
    </h1>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">


        <label>
            Product Code
        </label>

        <input
            type="text"
            name="product_code"
            placeholder="Example: PROD001"
            required
        >


        <label>
            Product Name
        </label>

        <input
            type="text"
            name="product_name"
            placeholder="Enter product name"
            required
        >


        <label>
            Price
        </label>

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Enter price"
            required
        >


        <label>
            Stock
        </label>

        <input
            type="number"
            name="stock"
            placeholder="Enter stock quantity"
            required
        >


        <label>
            Description
        </label>

        <textarea
            name="description"
            placeholder="Enter product description"
        ></textarea>


        <button type="submit">
            ADD PRODUCT
        </button>


    </form>


    <a
        href="{{ url_for('admin_dashboard') }}"
        class="back"
    >
        ← Back to Admin Dashboard
    </a>


</div>


</body>

</html>
