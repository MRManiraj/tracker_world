<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Warehouse</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f0ff,
                    #f5f7fb
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .login-container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }


        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;
        }


        h1 {

            margin: 0;

            text-align: center;

            color: #1f2937;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-top: 8px;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        .login-button {

            width: 100%;

            border: none;

            padding: 14px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            border-radius: 9px;

            cursor: pointer;
        }


        .login-button:hover {

            background: #1d4ed8;
        }


        .back-button {

            display: block;

            margin-top: 20px;

            text-align: center;

            text-decoration: none;

            color: #2563eb;

            font-weight: bold;
        }


        .flash {

            background: #fee2e2;

            color: #991b1b;

            border-radius: 8px;

            padding: 11px;

            margin-bottom: 20px;

            text-align: center;
        }


        @media(max-width: 500px) {

            .login-container {

                padding: 25px 20px;
            }

            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🏭
    </div>


    <h1>
        Admin Login
    </h1>


    <div class="subtitle">
        Warehouse Management System
    </div>


    <!-- FLASH MESSAGE -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- ADMIN LOGIN FORM -->

    <form
        method="POST"
        action="{{ url_for('admin_login') }}"
    >


        <div class="form-group">

            <label>
                Admin Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter Admin Username"
                required
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label>
                Admin Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter Admin Password"
                required
                autocomplete="current-password"
            >

        </div>


        <button
            type="submit"
            class="login-button"
        >
            LOGIN AS ADMIN
        </button>


    </form>


    <a
        href="{{ url_for('login') }}"
        class="back-button"
    >
        ← Employee Login
    </a>


</div>


</body>

</html>
