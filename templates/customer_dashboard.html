<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #111827;
            color: white;
            padding: 16px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .navbar h2 {
            margin: 0;
            font-size: 21px;
        }

        .logout {
            background: #ef4444;
            color: white;

            text-decoration: none;

            padding: 9px 16px;

            border-radius: 8px;

            font-weight: bold;
        }

        .logout:hover {
            background: #dc2626;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 94%;
            max-width: 1100px;
            margin: 35px auto;
        }


        /* =========================
           WELCOME BOX
        ========================= */

        .welcome {
            background: white;

            padding: 28px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }

        .welcome h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 25px;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: white;

            padding: 32px 20px;

            border-radius: 16px;

            text-align: center;

            height: 100%;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 28px
                rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 10px 0 8px;
            font-size: 20px;
        }

        .card p {
            color: #6b7280;
            margin: 0;
            line-height: 1.5;
        }


        /* =========================
           PRODUCTS CARD
        ========================= */

        .products-card {
            border-top: 4px solid #2563eb;
        }


        /* =========================
           CART CARD
        ========================= */

        .cart-card {
            border-top: 4px solid #f59e0b;
        }


        /* =========================
           ORDERS CARD
        ========================= */

        .orders-card {
            border-top: 4px solid #16a34a;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media(max-width: 750px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 20px;
            }

            .navbar {
                padding: 14px 16px;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .welcome {
                padding: 22px;
            }

            .welcome h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<!-- =================================
     NAVBAR
================================= -->

<div class="navbar">

    <h2>
        🛒 Warehouse Store
    </h2>


    <a
        href="{{ url_for('customer_logout') }}"
        class="logout"
    >
        Logout
    </a>

</div>


<!-- =================================
     MAIN CONTAINER
================================= -->

<div class="container">


    <!-- =================================
         WELCOME
    ================================= -->

    <div class="welcome">

        <h1>
            Welcome, {{ customer_name }} 👋
        </h1>

        <p>
            What would you like to do today?
        </p>

    </div>


    <!-- =================================
         DASHBOARD CARDS
    ================================= -->

    <div class="cards">


        <!-- =================================
             PRODUCTS
        ================================= -->

        <a
            href="{{ url_for('customer_products') }}"
            class="card-link"
        >

            <div class="card products-card">

                <div class="icon">
                    🛍️
                </div>

                <h3>
                    Products
                </h3>

                <p>
                    Browse available products and place your order.
                </p>

            </div>

        </a>


        <!-- =================================
             MY CART
        ================================= -->
        <a href="{{ url_for('customer_cart') }}" class="card-link">

      <div class="card">

        <h3>My Cart</h3>

        <p>
            View products added to cart
        </p>

    </div>

</a>


        <!-- =================================
             MY ORDERS
        ================================= -->

      <a href="{{ url_for('customer_orders') }}" class="card-link">
        <div class="card">
        <h3>My Orders</h3>
        <p>View and track your orders</p>
    </div>
    </a>


    </div>


</div>


</body>

</html>
