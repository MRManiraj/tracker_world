<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Packing - Warehouse</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="topbar">

    <div class="logo">
        Warehouse
    </div>


    <div class="user-area">

        <span>
            {{ session["employee_name"] }}
        </span>


        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</header>



<main class="page-container">


    <h1>Packing Order</h1>


    <div class="order-card">


        <div class="order-header">

            <h2>
                Order ID:
                {{ order["order_number"] }}
            </h2>


            <span class="status">
                PACKING
            </span>

        </div>



        <p>

            <strong>Item:</strong>

            {{ order["item_name"] }}

        </p>



        <p>

            <strong>Quantity:</strong>

            {{ order["quantity"] }}

        </p>



        <p>

            <strong>Status:</strong>

            {{ order["status"] }}

        </p>



        <br>



        <form method="POST">


            <button type="submit"
                    class="btn btn-primary">

                COMPLETE PACKING

            </button>


        </form>


    </div>


</main>


<script src="{{ url_for('static', filename='js/app.js') }}">
</script>


</body>

</html>
